# ============================================================================
# REZA BOT WORKFLOW
# ============================================================================
#
# شامل: ربات (reza_bot_v50_7.txt) و پلتفرم (reza_execution_platform_v1.txt)
#
# ============================================================================

name: REZA BOT WORKFLOW

on:
  # ✅ اجرا در زمان‌های مشخص
  schedule:
    - cron: '0 * * * *'      # هر ساعت در دقیقه 00 (برای ربات)
    - cron: '*/5 * * * *'    # هر 5 دقیقه (برای پلتفرم)
  
  # ✅ اجرای دستی
  workflow_dispatch:
    inputs:
      project:
        description: 'پروژه مورد نظر برای اجرا'
        required: true
        default: 'bot'
        type: choice
        options:
          - bot
          - platform
          - all

  # ✅ اجرا روی push
  push:
    branches: [ main ]

jobs:
  # ============================================================
  # JOB 1: REZA BOT
  # ============================================================
  run-bot:
    name: Run REZA BOT
    runs-on: ubuntu-latest
    if: |
      github.event_name == 'schedule' && github.event.schedule == '0 * * * *' ||
      github.event_name == 'workflow_dispatch' && inputs.project == 'bot' ||
      github.event_name == 'workflow_dispatch' && inputs.project == 'all' ||
      github.event_name == 'push'

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.10'
          cache: 'pip'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          if [ -f requirements.txt ]; then
            pip install -r requirements.txt
          else
            pip install requests
          fi

      - name: Create data directory
        run: mkdir -p reza_bot_v50_7_data

      - name: Run REZA BOT
        run: |
          echo "=========================================="
          echo "🔥 STARTING REZA BOT"
          echo "=========================================="
          echo "Time: $(date -u)"
          echo "=========================================="
          python reza_bot_v50_7.txt
        env:
          XT_API_KEY: ${{ secrets.XT_API_KEY }}
          XT_API_SECRET: ${{ secrets.XT_API_SECRET }}
          XT_MARGIN_USDT: ${{ secrets.XT_MARGIN_USDT }}
          XT_LEVERAGE: ${{ secrets.XT_LEVERAGE }}
          REZA_PLATFORM_URL: ${{ secrets.REZA_PLATFORM_URL }}
          REZA_PLATFORM_ENABLED: ${{ secrets.REZA_PLATFORM_ENABLED }}

      - name: Upload logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: bot-logs-${{ github.run_id }}
          path: |
            reza_bot_v50_7_data/
          retention-days: 7

      - name: Send notification on failure
        if: failure()
        run: |
          echo "❌ REZA BOT FAILED!"
          echo "Run ID: ${{ github.run_id }}"
          echo "Time: $(date -u)"

  # ============================================================
  # JOB 2: REZA EXECUTION PLATFORM
  # ============================================================
  run-platform:
    name: Run REZA EXECUTION PLATFORM
    runs-on: ubuntu-latest
    if: |
      github.event_name == 'schedule' && github.event.schedule == '*/5 * * * *' ||
      github.event_name == 'workflow_dispatch' && inputs.project == 'platform' ||
      github.event_name == 'workflow_dispatch' && inputs.project == 'all' ||
      github.event_name == 'push'

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.10'
          cache: 'pip'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          if [ -f requirements.txt ]; then
            pip install -r requirements.txt
          else
            pip install requests
          fi

      - name: Create data directory
        run: mkdir -p reza_execution_platform_v1_data

      - name: Run REZA EXECUTION PLATFORM
        run: |
          echo "=========================================="
          echo "🔥 STARTING REZA EXECUTION PLATFORM"
          echo "=========================================="
          echo "Time: $(date -u)"
          echo "=========================================="
          python reza_execution_platform_v1.txt
        env:
          XT_API_KEY: ${{ secrets.XT_API_KEY }}
          XT_API_SECRET: ${{ secrets.XT_API_SECRET }}
          XT_MARGIN_USDT: ${{ secrets.XT_MARGIN_USDT }}
          XT_LEVERAGE: ${{ secrets.XT_LEVERAGE }}
          REZA_WEBHOOK_ENABLED: ${{ secrets.REZA_WEBHOOK_ENABLED }}
          REZA_WEBHOOK_URL: ${{ secrets.REZA_WEBHOOK_URL }}
          REZA_WEBHOOK_SECRET: ${{ secrets.REZA_WEBHOOK_SECRET }}
          REZA_WEBHOOK_TIMEOUT: ${{ secrets.REZA_WEBHOOK_TIMEOUT }}

      - name: Upload logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: platform-logs-${{ github.run_id }}
          path: |
            reza_execution_platform_v1_data/
          retention-days: 7

      - name: Send notification on failure
        if: failure()
        run: |
          echo "❌ REZA EXECUTION PLATFORM FAILED!"
          echo "Run ID: ${{ github.run_id }}"
          echo "Time: $(date -u)"
