# ============================================================================
# REZA BOT & PLATFORM — با نمایش لاگ لایو
# ============================================================================

name: REZA BOT & PLATFORM

on:
  schedule:
    - cron: '0 * * * *'
  workflow_dispatch:
  push:
    branches: [ main ]

jobs:
  run-all:
    name: Run REZA BOT & PLATFORM
    runs-on: ubuntu-latest

    steps:
      # ============================================================
      # 1. دریافت کد
      # ============================================================
      - name: Checkout code
        uses: actions/checkout@v4

      # ============================================================
      # 2. نصب Python
      # ============================================================
      - name: Setup Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.10'

      # ============================================================
      # 3. نصب وابستگی‌ها
      # ============================================================
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install requests

      # ============================================================
      # 4. ایجاد دایرکتوری‌های داده
      # ============================================================
      - name: Create data directories
        run: |
          mkdir -p reza_bot_v50_7_data
          mkdir -p reza_execution_platform_v1_data

      # ============================================================
      # 5. اجرا با نمایش لاگ لایو
      # ============================================================
      - name: Run REZA BOT & PLATFORM
        run: |
          echo "=========================================="
          echo "🔥 STARTING REZA BOT & PLATFORM"
          echo "=========================================="
          echo "Time: $(date -u)"
          echo "=========================================="
          echo ""
          
          # ✅ اجرای ربات با نمایش خروجی لحظه‌ای
          python -u reza_bot_v50_7.txt &
          BOT_PID=$!
          
          # ✅ اجرای پلتفرم با نمایش خروجی لحظه‌ای
          python -u reza_execution_platform_v1.txt &
          PLATFORM_PID=$!
          
          echo "✅ BOT PID: $BOT_PID"
          echo "✅ PLATFORM PID: $PLATFORM_PID"
          echo ""
          echo "📡 LIVE LOGS:"
          echo "=========================================="
          echo ""
          
          # ✅ نمایش لاگ‌های لحظه‌ای
          wait $BOT_PID &
          wait $PLATFORM_PID &
          
          # نگه داشتن اجرا
          wait
          
        env:
          # ✅ غیرفعال کردن بافر برای خروجی لحظه‌ای
          PYTHONUNBUFFERED: 1
          
          # 🔑 تنظیمات ربات
          XT_API_KEY: ${{ secrets.XT_API_KEY }}
          XT_API_SECRET: ${{ secrets.XT_API_SECRET }}
          XT_MARGIN_USDT: ${{ secrets.XT_MARGIN_USDT }}
          XT_LEVERAGE: ${{ secrets.XT_LEVERAGE }}
          REZA_PLATFORM_URL: ${{ secrets.REZA_PLATFORM_URL }}
          REZA_PLATFORM_ENABLED: ${{ secrets.REZA_PLATFORM_ENABLED }}
          XT_BASE_URL: ${{ secrets.XT_BASE_URL }}
          
          # 🔑 تنظیمات پلتفرم
          REZA_WEBHOOK_ENABLED: ${{ secrets.REZA_WEBHOOK_ENABLED }}
          REZA_WEBHOOK_URL: ${{ secrets.REZA_WEBHOOK_URL }}
          REZA_WEBHOOK_SECRET: ${{ secrets.REZA_WEBHOOK_SECRET }}
          REZA_WEBHOOK_TIMEOUT: ${{ secrets.REZA_WEBHOOK_TIMEOUT }}

      # ============================================================
      # 6. ذخیره لاگ‌ها
      # ============================================================
      - name: Upload logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: logs-${{ github.run_id }}
          path: |
            reza_bot_v50_7_data/
            reza_execution_platform_v1_data/
          retention-days: 7

      # ============================================================
      # 7. نوتیفیکیشن خطا
      # ============================================================
      - name: Send notification on failure
        if: failure()
        run: |
          echo "❌ REZA BOT & PLATFORM FAILED!"
          echo "Run ID: ${{ github.run_id }}"
          echo "Time: $(date -u)"
