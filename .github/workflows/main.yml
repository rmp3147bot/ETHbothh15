# ============================================================================
# REZA BOT V50.7 — WORKFLOW (قابل استفاده برای همه ربات‌ها)
# ============================================================================
#
# این Workflow برای اجرای هر ربات REZA BOT طراحی شده است
# کافی است نام فایل ربات را در بخش run تغییر دهید
#
# ============================================================================

name: REZA BOT WORKFLOW

on:
  # ✅ اجرا در زمان‌های مشخص (با Cron)
  schedule:
    - cron: '0 * * * *'      # هر ساعت در دقیقه 00 (برای BOT_A)
    - cron: '15 * * * *'     # هر ساعت در دقیقه 15 (برای BOT_B)
    - cron: '30 * * * *'     # هر ساعت در دقیقه 30 (برای ربات‌های دیگر)
    - cron: '45 * * * *'     # هر ساعت در دقیقه 45 (برای ربات‌های دیگر)
  
  # ✅ اجرای دستی از طریق GitHub Actions UI
  workflow_dispatch:
    inputs:
      bot_file:
        description: 'نام فایل ربات (مثلاً reza_bot_v50_7.py)'
        required: true
        default: 'reza_bot_v50_7.py'
        type: string
      data_dir:
        description: 'نام دایرکتوری داده (مثلاً reza_bot_v50_7_data)'
        required: true
        default: 'reza_bot_v50_7_data'
        type: string

  # ✅ اجرا روی push به شاخه main
  push:
    branches: [ main ]

jobs:
  run-reza-bot:
    name: Run REZA BOT
    runs-on: ubuntu-latest
    
    strategy:
      matrix:
        # ✅ می‌توانید چندین ربات را همزمان اجرا کنید
        bot:
          - file: 'reza_bot_v50_7.py'
            data_dir: 'reza_bot_v50_7_data'
            description: 'BOT_A (HH:00)'
          - file: 'reza_bot_v50_7_hh15.py'
            data_dir: 'reza_bot_v50_7_data_hh15'
            description: 'BOT_B (HH:15)'
          # برای اضافه کردن ربات جدید، فقط یک خط جدید اضافه کنید:
          # - file: 'reza_bot_v50_7_hh30.py'
          #   data_dir: 'reza_bot_v50_7_data_hh30'
          #   description: 'BOT_C (HH:30)'

    steps:
      # ============================================================
      # 1. دریافت کد از مخزن
      # ============================================================
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      # ============================================================
      # 2. نصب Python
      # ============================================================
      - name: Setup Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.10'
          # در صورت وجود فایل requirements.txt، کش فعال می‌شود
          cache: 'pip'

      # ============================================================
      # 3. نصب وابستگی‌ها
      # ============================================================
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          # اگر فایل requirements.txt وجود دارد، از آن استفاده کن
          if [ -f requirements.txt ]; then
            pip install -r requirements.txt
          else
            pip install requests
          fi

      # ============================================================
      # 4. ایجاد دایرکتوری داده
      # ============================================================
      - name: Create data directory
        run: |
          mkdir -p ${{ matrix.bot.data_dir }}
          echo "📁 Data directory: ${{ matrix.bot.data_dir }}"

      # ============================================================
      # 5. اجرای ربات
      # ============================================================
      - name: Run ${{ matrix.bot.description }}
        run: |
          echo "=========================================="
          echo "🔥 STARTING ${{ matrix.bot.description }}"
          echo "=========================================="
          echo "Time: $(date -u)"
          echo "File: ${{ matrix.bot.file }}"
          echo "Data: ${{ matrix.bot.data_dir }}"
          echo "=========================================="
          python ${{ matrix.bot.file }}
        env:
          # 🔑 API Keys
          XT_API_KEY: ${{ secrets.XT_API_KEY }}
          XT_API_SECRET: ${{ secrets.XT_API_SECRET }}
          XT_MARGIN_USDT: ${{ secrets.XT_MARGIN_USDT }}
          XT_LEVERAGE: ${{ secrets.XT_LEVERAGE }}
          
          # 🌐 تنظیمات پلتفرم
          REZA_PLATFORM_URL: ${{ secrets.REZA_PLATFORM_URL }}
          REZA_PLATFORM_ENABLED: ${{ secrets.REZA_PLATFORM_ENABLED }}
          REZA_PLATFORM_TIMEOUT: ${{ secrets.REZA_PLATFORM_TIMEOUT }}
          REZA_PLATFORM_RETRY_SECONDS: ${{ secrets.REZA_PLATFORM_RETRY_SECONDS }}
          REZA_PLATFORM_HEALTH_INTERVAL: ${{ secrets.REZA_PLATFORM_HEALTH_INTERVAL }}
          
          # 📊 تنظیمات ربات
          XT_BASE_URL: ${{ secrets.XT_BASE_URL }}

      # ============================================================
      # 6. ذخیره لاگ‌ها به عنوان Artifact
      # ============================================================
      - name: Upload logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: logs-${{ matrix.bot.data_dir }}-${{ github.run_id }}
          path: |
            ${{ matrix.bot.data_dir }}/
            *.log
          retention-days: 7
          compression-level: 6

      # ============================================================
      # 7. ارسال نوتیفیکیشن در صورت خطا
      # ============================================================
      - name: Send notification on failure
        if: failure()
        run: |
          echo "❌ ${{ matrix.bot.description }} FAILED!"
          echo "Run ID: ${{ github.run_id }}"
          echo "Time: $(date -u)"
          echo "Bot File: ${{ matrix.bot.file }}"
